services:
  backend-trivial:
    build:
      context: .
      dockerfile: backend/trivial.Dockerfile
    profiles: [trivial]
    volumes:
      - ./backend/trivial.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

  proxy-trivial:
    build:
      context: ..
    profiles: [trivial]
    depends_on:
      - backend-trivial
    volumes:
      - ./configs/trivial.json:/config/config.json:ro
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["ssh-keygen -q -t ed25519 -N '' -f /run/host_key && exec /usr/local/bin/sftp-proxy -config /config/config.json"]

  clients-trivial:
    build:
      context: .
      dockerfile: clients.Dockerfile
    profiles: [trivial]
    depends_on:
      - proxy-trivial
    volumes:
      - ./clients:/tests:ro
      - ./fixtures:/fixtures:ro
    command: ["/bin/sh", "/tests/trivial.sh"]

  backend-full:
    image: node:22-alpine
    profiles: [full]
    volumes:
      - ./backend/full.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

  proxy-full:
    build:
      context: ..
    profiles: [full]
    depends_on:
      - backend-full
    ports:
      - "2222:2222"
    volumes:
      - ./configs/full.json:/config/config.json:ro
      - full-hostkey:/run
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["ssh-keygen -q -t ed25519 -N '' -f /run/host_key && exec /usr/local/bin/sftp-proxy -config /config/config.json"]

  clients-full:
    build:
      context: .
      dockerfile: clients.Dockerfile
    profiles: [full]
    depends_on:
      - proxy-full
    volumes:
      - ./clients:/tests:ro
      - ./fixtures:/fixtures:ro
      - full-hostkey:/hostkey:ro
    command:
      - /bin/sh
      - -ec
      - >
        python /tests/full.py &&
        /tests/full-openssh.sh &&
        /tests/full-lftp.sh &&
        /tests/full-psftp.sh &&
        /tests/full-scp-openssh.sh &&
        /tests/full-scp-pscp.sh &&
        python /tests/full-scp.py

  # A real object store. The buckets and their seed objects are put by the
  # client container with an ordinary S3 client, so what the proxy serves is an
  # ordinary object rather than something arranged to suit it.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [s3]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data"]

  backend-s3:
    image: node:22-alpine
    profiles: [s3]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./backend/s3.js:/app/server.js:ro
    command: ["node", "/app/server.js"]

  proxy-s3:
    build:
      context: ..
    profiles: [s3]
    depends_on:
      - backend-s3
      - minio
    volumes:
      - ./configs/s3.json:/config/config.json:ro
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["ssh-keygen -q -t ed25519 -N '' -f /run/host_key && exec /usr/local/bin/sftp-proxy -config /config/config.json"]

  clients-s3:
    build:
      context: .
      dockerfile: clients.Dockerfile
    profiles: [s3]
    depends_on:
      - proxy-s3
    volumes:
      - ./clients:/tests:ro
      - ./fixtures:/fixtures:ro
    command:
      - /bin/sh
      - -ec
      - >
        python /tests/s3-seed.py &&
        python /tests/s3.py &&
        /tests/s3-openssh.sh

volumes:
  full-hostkey: